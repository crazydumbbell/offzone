<title>Offzone</title><meta name="description" content="Block distracting apps by schedule or place. Quick focus timer &amp; daily journal."><meta name="robots" content="index,follow"><style>:root{--butter:#F7F0C7;--ivory:#FAF7E8;--pine:#3D5B3F;--ink:#1F2A22;--soft:#5E6660}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--butter);color:var(--ink);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif}
header{width:100%;max-width:760px;margin:0 auto;padding:28px 24px 0;display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}

main{width:100%;max-width:760px;margin:0 auto;padding:12px 24px 72px;flex:1}
h1{font-size:2.1rem;line-height:1.2;margin:48px 0 12px}h2{font-size:1.2rem;margin:36px 0 6px;color:var(--pine)}h2 .n{opacity:.55;margin-right:.6em;font-variant-numeric:tabular-nums}
p,li{color:var(--ink)}p.meta{color:var(--soft)}ul{padding-left:1.2em}li{margin:.35em 0}a{color:var(--pine)}
section{background:var(--ivory);border-radius:18px;padding:4px 22px 18px;margin:18px 0}
.tagline{margin:0 0 28px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:28px 0 0}
.links a{display:flex;align-items:center;justify-content:space-between;background:var(--ivory);border:1px solid rgba(61,91,63,.12);border-radius:18px;padding:20px 22px;color:var(--pine);text-decoration:none;font-weight:600;transition:border-color .15s ease,transform .15s ease}
.links a:hover{border-color:rgba(61,91,63,.38);transform:translateY(-1px)}
.links .arrow{opacity:.65}
footer{width:100%;max-width:760px;margin:0 auto;padding:0 24px 28px;font-size:13px;color:var(--soft)}
footer a{color:var(--soft);text-decoration:none}footer a:hover{color:var(--pine);text-decoration:underline}
a:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:4px}
.links a:focus-visible{border-radius:18px}
@media (max-width:520px){h1{margin-top:32px}.links{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.links a{transition:none}.links a:hover{transform:none}}
