<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="leaflet.css"><style>html,body{height:100%;width:100%;margin:0;overflow:hidden}#map{position:fixed;inset:0}#pin{position:absolute;top:50%;left:50%;z-index:999;font:bold 32px sans-serif;transform:translate(-50%,-50%);pointer-events:none;color:#191b19}</style></head><body><div id="map"></div><div id="pin" aria-hidden="true">+</div><script src="leaflet.js"></script><script>const params=new URLSearchParams(location.search),lat=Number(params.get('lat')),lon=Number(params.get('lon'));const valid=Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180;const map=L.map('map').setView(valid?[lat,lon]:[20,0],params.get('zoom')==='16'&&valid?16:2);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);function pick(){const p=map.getCenter();OffzoneMap.select(p.lat,p.lng)}map.on('moveend',pick);if(window.ResizeObserver)new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));setTimeout(()=>map.invalidateSize(),0);function center(lat,lon){map.setView([lat,lon],16)};</script></body></html>
